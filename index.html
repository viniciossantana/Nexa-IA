<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa Marketing AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0b0b10;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat {
            width: 100%;
            max-width: 800px;
            height: 700px;
            background: #12121a;
            border: 1px solid #252535;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .cabecalho {
            padding: 22px 25px;
            border-bottom: 1px solid #252535;
            background: #15151f;
        }

        .cabecalho h1 {
            font-size: 20px;
        }

        .cabecalho p {
            margin-top: 5px;
            color: #9999aa;
            font-size: 13px;
        }

        .mensagens {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .mensagem {
            max-width: 80%;
            padding: 14px 17px;
            border-radius: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .ia {
            align-self: flex-start;
            background: #1c1c28;
            border: 1px solid #29293a;
        }

        .usuario {
            align-self: flex-end;
            background: #7c3aed;
        }

        .digitando {
            color: #9999aa;
            font-size: 13px;
        }

        .entrada {
            padding: 18px;
            border-top: 1px solid #252535;
            display: flex;
            gap: 10px;
        }

        .entrada input {
            flex: 1;
            background: #1c1c27;
            color: #fff;
            border: 1px solid #303044;
            border-radius: 12px;
            padding: 14px;
            outline: none;
            font-size: 15px;
        }

        .entrada input:focus {
            border-color: #7c3aed;
        }

        .entrada button {
            border: none;
            background: #7c3aed;
            color: white;
            padding: 0 22px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .entrada button:hover {
            background: #6d28d9;
        }

        .entrada button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            body {
                padding: 0;
            }

            .chat {
                height: 100vh;
                border-radius: 0;
            }

            .mensagem {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

    <main class="chat">

        <header class="cabecalho">
            <h1>🤖 Nexa Marketing AI</h1>
            <p>Especialista em Marketing Digital</p>
        </header>

        <section class="mensagens" id="mensagens">
            <div class="mensagem ia">
                Olá! Eu sou a Nexa Marketing AI.

                Posso ajudar com estratégia, branding, conteúdo, posicionamento, campanhas e marketing digital.

                Como posso ajudar?
            </div>
        </section>

        <form class="entrada" id="formulario">
            <input
                type="text"
                id="mensagem"
                placeholder="Digite sua mensagem..."
                autocomplete="off"
                required
            >

            <button type="submit" id="enviar">
                Enviar
            </button>
        </form>

    </main>

    <script>
        const formulario = document.getElementById("formulario");
        const campoMensagem = document.getElementById("mensagem");
        const mensagens = document.getElementById("mensagens");
        const botaoEnviar = document.getElementById("enviar");

        function adicionarMensagem(texto, tipo) {
            const elemento = document.createElement("div");

            elemento.className = `mensagem ${tipo}`;
            elemento.textContent = texto;

            mensagens.appendChild(elemento);
            mensagens.scrollTop = mensagens.scrollHeight;

            return elemento;
        }

        formulario.addEventListener("submit", async (evento) => {
            evento.preventDefault();

            const texto = campoMensagem.value.trim();

            if (!texto) {
                return;
            }

            adicionarMensagem(texto, "usuario");

            campoMensagem.value = "";
            campoMensagem.disabled = true;
            botaoEnviar.disabled = true;
            botaoEnviar.textContent = "...";

            const carregando = adicionarMensagem(
                "Pensando...",
                "ia"
            );

            try {
                const resposta = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        mensagem: texto
                    })
                });

                const dados = await resposta.json();

                carregando.remove();

                if (!resposta.ok) {
                    throw new Error(dados.erro || "Erro ao conversar com a IA.");
                }

                adicionarMensagem(dados.resposta, "ia");

            } catch (erro) {
                carregando.remove();

                adicionarMensagem(
                    "Desculpe, ocorreu um erro ao processar sua mensagem.",
                    "ia"
                );

                console.error(erro);

            } finally {
                campoMensagem.disabled = false;
                botaoEnviar.disabled = false;
                botaoEnviar.textContent = "Enviar";
                campoMensagem.focus();
            }
        });
    </script>

</body>
</html>
